<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEND THIS || Redefining how a city shops</title>
<meta name="description" content="Vend This brings Japan's beloved vending machine culture to the United States: small, beautiful, high-tech stores run entirely by smart vending machines.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>/* Vend This — brand styles
   Double Cream #F8F2E7 / Machine Green #9AA68D / White #FFFFFF / Soft Black #262729 */
:root {
  --cream: #F8F2E7;
  --green: #9AA68D;
  --green-dark: #7E8A72;
  --white: #FFFFFF;
  --black: #262729;
  --font-head: 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --font-body: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-body);
  background: var(--cream);
  color: var(--black);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; display: block; }
a { color: inherit; }

/* ---------- nav ---------- */
.site-nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 32px;
  transition: background .3s, box-shadow .3s;
}
.site-nav.solid { background: var(--cream); box-shadow: 0 1px 0 rgba(38,39,41,.08); }
.site-nav .brand {
  font-family: var(--font-head); font-weight: 700; letter-spacing: .14em;
  font-size: 15px; text-decoration: none;
}
.site-nav ul { display: flex; gap: 28px; list-style: none; }
.site-nav ul a {
  text-decoration: none; font-size: 14px; letter-spacing: .06em;
  font-weight: 500; opacity: .85;
}
.site-nav ul a:hover { opacity: 1; }
.site-nav.on-dark { color: var(--white); }
.site-nav.on-dark.solid { color: var(--black); }
.nav-toggle { display: none; background: none; border: 0; cursor: pointer; padding: 8px; }
.nav-toggle span { display: block; width: 26px; height: 2px; background: currentColor; margin: 6px 0; }

/* ---------- hero (home) ---------- */
.hero {
  min-height: 100vh; min-height: 100svh;
  position: relative; overflow: hidden;
  display: flex; align-items: flex-end; justify-content: center;
  background: var(--cream);
}
.hero-video {
  position: absolute; inset: 0;
  width: 100%; height: 100%; object-fit: cover;
}
.sound-toggle {
  position: absolute; bottom: 28px; right: 28px; z-index: 2;
  font-family: var(--font-head); font-weight: 600; font-size: 12px; letter-spacing: .18em;
  color: #fff; background: rgba(38,39,41,.55); border: 1px solid rgba(255,255,255,.35);
  border-radius: 999px; padding: 10px 18px; cursor: pointer;
  backdrop-filter: blur(4px);
}
.sound-toggle:hover { background: rgba(38,39,41,.8); }
/* no footer anywhere: pages end with their last section */

/* ---------- generic page ---------- */
.page { padding: 120px 24px 96px; max-width: 880px; margin: 0 auto; }
.eyebrow {
  font-family: var(--font-head); font-weight: 600;
  font-size: 13px; letter-spacing: .28em; text-transform: uppercase;
  margin-bottom: 18px; color: var(--green-dark);
}
h1.page-title {
  font-family: var(--font-head); font-weight: 700;
  font-size: clamp(34px, 6vw, 56px); letter-spacing: .02em;
  line-height: 1.1; margin-bottom: 28px;
}
.lede { font-size: clamp(17px, 2.4vw, 21px); line-height: 1.65; max-width: 640px; }
.section-gap { height: 72px; }

/* ---------- about ---------- */
.about-top { background: var(--cream); }
.founder { background: var(--black); color: var(--white); }
.founder .eyebrow { color: var(--green); }
.founder-inner { max-width: 880px; margin: 0 auto; padding: 96px 24px; }
.founder h1.page-title { color: var(--white); }
.founder-photo {
  width: min(320px, 70vw); border-radius: 4px; margin: 36px 0;
}
.founder p { margin-bottom: 22px; font-size: 17px; line-height: 1.7; color: rgba(255,255,255,.88); max-width: 640px; }
.founder p strong { color: var(--white); }

/* ---------- buttons ---------- */
.btn {
  display: inline-block; font-family: var(--font-head); font-weight: 600;
  font-size: 15px; letter-spacing: .04em; text-decoration: none;
  background: var(--black); color: var(--white);
  padding: 16px 34px; border-radius: 999px; border: 0; cursor: pointer;
  transition: transform .15s, background .2s;
}
.btn:hover { background: #3a3b3d; transform: translateY(-1px); }
.btn-green { background: var(--green); color: var(--black); }
.btn-green:hover { background: var(--green-dark); }

/* ---------- contact form ---------- */
.form { margin-top: 40px; max-width: 620px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.field { margin-bottom: 20px; }
.field label { display: block; font-size: 13px; font-weight: 600; letter-spacing: .06em; margin-bottom: 8px; text-transform: uppercase; }
.field label .req { color: var(--green-dark); }
.field input, .field textarea {
  width: 100%; font-family: var(--font-body); font-size: 16px;
  padding: 14px 16px; border: 1.5px solid rgba(38,39,41,.25);
  border-radius: 8px; background: var(--white); color: var(--black);
}
.field input:focus, .field textarea:focus { outline: none; border-color: var(--green-dark); }
.field textarea { min-height: 150px; resize: vertical; }
.form-note { font-size: 14px; opacity: .7; margin-top: 18px; }

/* ---------- invest gate ---------- */
.gate { max-width: 420px; margin: 40px auto 0; text-align: center; }
.gate input {
  width: 100%; font-size: 16px; padding: 14px 16px; text-align: center;
  border: 1.5px solid rgba(38,39,41,.25); border-radius: 8px; margin-bottom: 16px;
  background: var(--white);
}
.gate-error { color: #a33; font-size: 14px; margin-top: 12px; min-height: 20px; }
.invest-links { display: none; margin-top: 40px; }
.invest-links.open { display: block; }
.invest-links .btn { margin: 8px; }

/* ---------- responsive ---------- */
@media (max-width: 640px) {
  .site-nav { padding: 16px 20px; }
  .site-nav ul {
    display: none; position: fixed; top: 0; right: 0; bottom: 0; left: 0;
    background: var(--cream); flex-direction: column; align-items: center;
    justify-content: center; gap: 32px;
  }
  .site-nav ul a { font-size: 22px; }
  .site-nav.menu-open ul { display: flex; }
  .site-nav.menu-open { color: var(--black); }
  .nav-toggle { display: block; z-index: 60; position: relative; }
  .form-row { grid-template-columns: 1fr; }
  .page { padding-top: 104px; }
}
</style>
</head>
<body>

<nav class="site-nav on-dark" id="nav">
  <a class="brand" href="index.html">VEND THIS</a>
  <button class="nav-toggle" aria-label="Menu" onclick="document.getElementById('nav').classList.toggle('menu-open')">
    <span></span><span></span><span></span>
  </button>
  <ul>
    <li><a href="about.html">About</a></li>
    <li><a href="https://sharemyhtml.com/p/Dy9-vi55bc" target="_blank" rel="noopener">Partners</a></li>
    <li><a href="invest.html">Invest</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</nav>

<section class="hero">
  <video class="hero-video" id="heroVideo" autoplay muted loop playsinline aria-label="A sage-green Vend This vending machine floating among clouds">
    <source src="hero-sky.mp4" type="video/mp4">
  </video>
  <button class="sound-toggle" id="soundToggle" aria-label="Toggle sound">SOUND OFF</button>
</section>

<script>
const v = document.getElementById('heroVideo');
const btn = document.getElementById('soundToggle');
btn.addEventListener('click', () => {
  v.muted = !v.muted;
  btn.textContent = v.muted ? 'SOUND OFF' : 'SOUND ON';
  if (!v.muted) v.play();
});
</script>

</body>
</html>
